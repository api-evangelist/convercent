name: Convercent
description: >-
  Convercent (now "Convercent by OneTrust") is an enterprise ethics and compliance
  GRC SaaS platform providing case and helpline management, policy management and
  attestations, compliance training and learning, campaigns, disclosures, and an
  interactive code of conduct. Acquired by OneTrust in 2021, its customer base is
  being migrated to EQS Group. Convercent exposes compliance reporting data through
  an OData data-services API (v4/v5) covering case management, campaigns, policy
  attestations, and course completions, authenticated with HTTP Basic and intended
  for administrators/moderators to connect BI and reporting tools.
